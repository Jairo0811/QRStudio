name: CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore QRStudio.sln

      - name: Build
        run: dotnet build QRStudio.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test QRStudio.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
